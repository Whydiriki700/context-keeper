name: context-keeper
version: 0.1.0
description: "When a session ends, its working memory should not end with it. Context Keeper records a rolling checkpoint of the session as it works (tools used, files touched, recent actions, plus any summary the agent saves on purpose), stores it on disk under the Hermes home, and injects the latest checkpoint into the first turn of the next session so work resumes instead of restarting."
author: "Riki Wahyudi"
requires_hermes: ">=0.22.0"
provides_tools:
  - context_save
  - context_restore
provides_hooks:
  - post_tool_call
  - pre_llm_call
